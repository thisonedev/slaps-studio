name: Desktop tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast, deterministic, no network and no spawning. Gates every PR.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/setup

      # No postinstall from a fork PR's dependencies, same as deploy.yml.
      # This job never needed the Electron download anyway (tsc build, node-spawned tests).
      - name: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # unit/ipc-identity-schemas.cjs imports @studio/validation's build output.
      - name: build workspace packages
        run: pnpm build:packages

      # Dependency audit, non-blocking while the baseline is still being
      # triaged. Pin the audit level once the report is clean and the job
      # flips to blocking in this same workflow.
      - name: dependency audit
        run: pnpm audit --prod --audit-level=low || true

      - name: unit tests
        run: pnpm --filter @studio/desktop test:unit
